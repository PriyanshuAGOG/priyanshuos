<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Priyanshu · Character Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17191e;color:#eee;font:15px system-ui}main{max-width:1080px;margin:auto;padding:28px}h1{font-size:24px;font-weight:500;margin:0}p{color:#a7acb7;line-height:1.5}.stage{height:660px;max-height:72vh;background:radial-gradient(ellipse at 50% 35%,#464c58,#20242b 55%,#16191e);border-radius:24px;position:relative}#avatar{height:100%;width:min(100%,600px);margin:auto}#avatar canvas{width:100%;height:100%}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}button,a{border:1px solid #505766;border-radius:20px;padding:9px 15px;background:#282d35;color:#eee;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#c7ff3d;color:#111}label{display:inline-flex;align-items:center;gap:10px;margin-right:20px}footer{display:flex;gap:15px;align-items:center;flex-wrap:wrap}
</style></head><body><main><h1>Priyanshu · Character Studio</h1><p>A full body, articulated character. Explore the gestures and rotate the model.</p><div class="stage"><div id="avatar"></div></div><div class="controls" id="poses"></div><footer><label>Turn <input id="turn" type="range" min="-180" max="180" value="0"></label><label>Speech energy <input id="voice" type="range" min="0" max="1" step=".01" value="0"></label><a href="/assets/avatar/priyanshu-articulated.glb" download>Download GLB</a></footer></main>
<script type="module">
import { createMascot } from './src/mascot/mascot-engine.js';
const avatar=createMascot(document.querySelector('#avatar'));await avatar.ready;
window.studioAvatar=avatar;
const turn=document.querySelector('#turn');
turn.addEventListener('input',()=>{const a=Number(turn.value)*Math.PI/180;const {camera}=avatar._runtime;camera.position.set(Math.sin(a)*4.45,1.02,Math.cos(a)*4.45);camera.lookAt(0,1.02,0);});
document.querySelector('#voice').addEventListener('input',e=>{avatar.setSpeaking(Number(e.target.value)>0);avatar.setAudioLevel(Number(e.target.value));});
for(const state of avatar.states){const b=document.createElement('button');b.textContent=state==='highfive'?'High five':state[0].toUpperCase()+state.slice(1);b.setAttribute('aria-pressed',state==='idle');b.onclick=()=>{avatar.setSpeaking(false);avatar.trigger(state);document.querySelectorAll('#poses button').forEach(el=>el.setAttribute('aria-pressed',el===b));};document.querySelector('#poses').append(b);}
window.addEventListener('pagehide',()=>avatar.destroy());
</script></body></html>
